# ============================================================
#  12306 自动抢票 - 配置文件
#  修改前请先关闭正在运行的抢票程序；改完保存即可。
#  车站 cookie 值可用根目录的「获取车站Cookie值.cmd」查询。
# ============================================================

# ---------- 起点站 / 终点站 ----------
# 格式："%uXXXX%uXXXX%2C电报码"
# 示例："%u5317%u4EAC%2CBJP"（北京）
# 获取方式：双击根目录「获取车站Cookie值.cmd」，会自动复制到剪贴板
起点站: ""
终点站: ""

# ---------- 购票信息 ----------
# 购票日期，格式 YYYY-MM-DD，示例：1970-01-01
购票日期: ""
# 开抢时间，格式 YYYY-MM-DD HH:MM:SS，示例：1970-01-01 12:00:00
# 建议设为放票时刻前 1~3 秒
开抢时间: ""

# ---------- 车次与乘车人 ----------
# 车次序号：按时间排序后买第几班，1 表示最早一班，0 表示按列表顺序尝试
车次序号: 1

# 乘车人姓名，必须为 12306 账号中已添加的乘客，可填多个
# 示例：["张三"]
#       ["张三", "李四"]
乘车人: []

# 是否启用按乘客设置席别：true 为启用，false 为关闭
# 启用后，席别列表按顺序与乘车人一一对应；
# 如果席别数少于乘车人数，多出的乘客默认使用最后一个席别；
# 如果席别只填一个，则所有乘客统一使用该席别。
# 例如：
#   乘车人: ["张三", "李四", "王五"]
#   席别: ["一等座", "二等座"]
#   则 张三→一等座，李四→二等座，王五→二等座
# 关闭时，所有乘客统一使用席别列表的第一个值。
启用按乘客设置席别: false

# 席别：二等座 / 一等座 / 特等座 / 商务座
# 可填单个值或列表。
# 示例：
#   席别: ["二等座"]
#   席别: ["一等座", "二等座"]
席别: ["二等座"]

# 是否学生票：true 为是，false 为否
学生票: false

# 座位偏好：二等座 A/B/C/D/F；一等座 A/C/D/F；特等座 A/C/F；商务座 A/F
# 示例：F
# 留空表示不选座，由系统自动分配
# 注意：订单含多种席别时，在线选座将被禁用
座位偏好: ""

# ---------- 浏览器与驱动 ----------
# ChromeDriver 路径，保持默认即可
驱动路径: ./asset/chromedriver.exe

# ---------- 邮件通知 ----------
# 是否启用邮件通知：true 为启用，false 为关闭
启用邮件通知: false
# 发件人邮箱，示例：xxx@qq.com
发件邮箱: ""
# 发件邮箱 SMTP 授权码，非登录密码
邮箱授权码: ""
# 收件人邮箱，示例：xxx@qq.com
收件邮箱: ""
# 发件人显示昵称
发件人昵称: 12306抢票助手
# 收件人显示昵称
收件人昵称: 我
# SMTP 服务器地址
# QQ 邮箱：smtp.qq.com
# 163 邮箱：smtp.163.com
# 126 邮箱：smtp.126.com
SMTP服务器: smtp.qq.com
# SMTP 端口，SSL 加密通常为 465
SMTP端口: 465

# ============================================================
#  以下为高级配置，一般无需修改
# ============================================================

# ---------- 保活线程 ----------
# 保活线程运行间隔（秒），默认 480 秒（8 分钟）
# 用于在等待抢票期间定期检查会话状态
保活间隔: 480

# ---------- 查询控制 ----------
# 最大查询次数，超过后退出程序
最大查询次数: 30
# 每次查询失败后的间隔（秒）
查询间隔: 0.05

# ---------- 选座控制 ----------
# 选座尝试的排数范围，默认第 1 排到第 5 排
选座起始排: 1
选座结束排: 5

# ---------- 登录控制 ----------
# 扫码登录的超时时间（秒）
扫码超时: 120
# 无记录自动选择的等待时间（秒）
登录选择超时: 60

# ---------- 抢票后处理 ----------
# 抢票成功后停留时间（秒），方便手动支付
成功后停留: 60

# ---------- 其他 ----------
# 是否注入 CSS 隐藏登录页无关二维码：true 为是，false 为否
隐藏无关二维码: true